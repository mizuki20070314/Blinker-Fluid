name: SDK headers (diagnostic)

# Prints the BrowserEngineKit key-event headers of the runner's iOS SDK. The modern UI feeds the engine a stand-in for the
# system's key entry (on iOS versions that do not have the real one), so the property names and enum values it relies on are
# checked here against the real headers.
on:
  workflow_dispatch:

jobs:
  headers:
    runs-on: macos-latest
    steps:
      - name: Find the headers
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          echo "SDK: $SDK"
          H="$SDK/System/Library/Frameworks/BrowserEngineKit.framework/Headers"
          ls "$H" | head -80
      - name: BEKeyEntry / BEKey / BEKeyPressState
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          H="$SDK/System/Library/Frameworks/BrowserEngineKit.framework/Headers"
          for f in BEKeyEntry.h BEKey.h BEKeyEntryContext.h BETextInput.h; do
            echo "=================== $f"
            if [ -f "$H/$f" ]; then cat "$H/$f"; else echo "(missing)"; fi
          done
      - name: Where the key-press state enum is declared
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          H="$SDK/System/Library/Frameworks/BrowserEngineKit.framework/Headers"
          grep -rn "BEKeyPressState" "$H" | head -40
