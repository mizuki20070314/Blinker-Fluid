name: Modern UI

# Builds the modern browser UI (modern-ui/) and puts it into the released Blinker Fluid IPAs.
#   package : for the stable build AND the JIT build of the iOS 12 release (they differ only by bundle identifier):
#             checks that the released binary still matches what the hooks expect, builds BlinkerModernUI.framework for iOS 12+,
#             adds it to a copy of the released IPA and verifies the result.
#             -> artifacts "BlinkerFluid-ModernUI-ios12-stable-ipa" and "BlinkerFluid-ModernUI-ios12-jit-ipa"
#   screens : runs the UI on an iOS simulator (in a 320x568 window, like an iPod touch), saves pictures of every screen and runs
#             the automatic checks.  -> artifact "modern-ui-screens"

on:
  push:
    branches: [modern-ui, main]
    paths:
      - "modern-ui/**"
      - ".github/workflows/modern-ui.yml"
  workflow_dispatch:

concurrency:
  group: modern-ui-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: stable
            file: iOS.12.11.Blinker.Fluid.v.0.3.1.ipa
            sha256: e26dc439b2b97170cd86b23685cf3d46658484d3207d5c9d8090cbf9365822eb
          - variant: jit
            file: iOS.12.11.Blinker.Fluid.v.0.3.1.JIT.ipa
            sha256: 557dcf9c2898eba7a7ccff21bf9f1a341ab5114a5d62679ed90d4f77d9e595e4
    env:
      OUT_IPA: BlinkerFluid-ModernUI-ios12-${{ matrix.variant }}.ipa
    steps:
      - uses: actions/checkout@v4

      - name: Machine
        run: |
          sw_vers
          uname -m
          echo "cpus: $(sysctl -n hw.ncpu), memory: $(( $(sysctl -n hw.memsize) / 1048576 )) MiB"
          df -h / | tail -1
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Fetch the released IPA (${{ matrix.variant }})
        run: |
          curl -fL --retry 3 -o base.ipa "https://github.com/Nodesclock/Blinker-Fluid/releases/download/v.0.3.1/${{ matrix.file }}"
          echo "${{ matrix.sha256 }}  base.ipa" | shasum -a 256 -c -
          ls -l base.ipa

      - name: Contract - does the released binary match what the hooks expect?
        run: |
          unzip -p base.ipa 'Payload/*.app/Frameworks/content_shell_framework.framework/content_shell_framework' > fw.bin
          python3 modern-ui/tools/objc_dump.py fw.bin objc.json
          python3 modern-ui/tools/check_contract.py objc.json modern-ui/Sources/Hooks/BKContract.inc modern-ui/Sources/Hooks/BKContractIME.inc
          rm -f fw.bin

      - name: Install ldid
        run: brew install ldid

      - name: Build BlinkerModernUI.framework (iOS 12, arm64)
        env:
          BK_VERSION: 0.3.1-ui.${{ github.run_number }}
        run: bash modern-ui/build/build_device.sh build/device

      - name: Put it into the IPA
        run: bash modern-ui/build/package_ipa.sh base.ipa build/device/BlinkerModernUI.framework "dist/$OUT_IPA" "${{ github.run_number }}"

      - name: Verify the IPA
        run: python3 modern-ui/tools/verify_ipa.py "dist/$OUT_IPA" base.ipa

      - name: Details of the signed binaries
        run: |
          rm -rf check && mkdir check && unzip -q "dist/$OUT_IPA" -d check
          APP="$(echo check/Payload/*.app)"
          EXE="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"
          echo "--- bundle"; /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"; /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "$APP/Info.plist"
          echo "--- otool -L (executable)"; otool -L "$EXE"
          echo "--- ldid -e (executable)"; ldid -e "$EXE"
          echo "--- signature: original vs new executable"
          rm -rf orig && mkdir orig && unzip -q -o base.ipa 'Payload/*.app/content_shell' -d orig
          codesign -dvv orig/Payload/*.app/content_shell 2>&1 | grep -E 'Signature|CodeDirectory|Hash|Format|flags' || true
          echo '   --- new:'
          codesign -dvv "$EXE" 2>&1 | grep -E 'Signature|CodeDirectory|Hash|Format|flags' || true
          echo "--- otool -L (modern UI)"; otool -L "$APP/Frameworks/BlinkerModernUI.framework/BlinkerModernUI"
          echo "--- minos"; otool -l "$APP/Frameworks/BlinkerModernUI.framework/BlinkerModernUI" | grep -A4 -E "LC_BUILD_VERSION|LC_VERSION_MIN" | head -12
          shasum -a 256 dist/*.ipa | tee dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BlinkerFluid-ModernUI-ios12-${{ matrix.variant }}-ipa
          path: dist/
          if-no-files-found: error

  screens:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the simulator test app
        run: bash modern-ui/build/build_harness.sh build/harness src/content/shell/browser/shell_platform_delegate_ios.mm

      - name: Run it and take the pictures
        run: bash modern-ui/build/run_harness.sh build/harness/Harness.app screens

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: modern-ui-screens
          path: screens/
